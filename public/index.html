<!DOCTYPE html>
<html>
<head>
  <title>Sehat Antri</title>
  <style>
    body { 
      font-family: Arial; 
      padding: 20px; 
      background: #f5f5f5;
    }

    h1 { 
      color: green; 
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, button {
      margin: 5px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: green;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
      color: blue;
    }
  </style>
</head>

<body>

<h1>Sehat Antri 🏥</h1>

<div class="card">
  <h2>Booking Puskesmas</h2>

  <input type="text" id="name" placeholder="Nama">
  <input type="date" id="date">
  <button onclick="booking()">Booking</button>

  <div id="bookingResult" class="result"></div>
</div>

<div class="card">
  <h2>Upload Foto</h2>

  <input type="file" id="file">
  <input type="number" id="booking_id" placeholder="Booking ID">
  <button onclick="upload()">Upload</button>

  <div id="uploadResult" class="result"></div>
</div>

<script>
const API = "http://52.63.125.12:3000";

async function booking() {
  const name = document.getElementById("name").value;
  const date = document.getElementById("date").value;

  if (!name || !date) {
    alert("Isi semua data!");
    return;
  }

  const res = await fetch(API + "/booking", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, date })
  });

  const data = await res.json();

  document.getElementById("bookingResult").innerHTML =
    "✅ Booking berhasil! Nomor antrian: <b>" + data.nomor_antrian + "</b>";
}

async function upload() {
  const file = document.getElementById("file").files[0];
  const bookingId = document.getElementById("booking_id").value;

  if (!file || !bookingId) {
    alert("File dan Booking ID wajib diisi!");
    return;
  }

  const form = new FormData();
  form.append("file", file);
  form.append("booking_id", bookingId);

  const res = await fetch(API + "/upload", {
    method: "POST",
    body: form
  });

  const data = await res.json();

  document.getElementById("uploadResult").innerHTML =
    "📸 Upload berhasil! <br><a href='" + data.url + "' target='_blank'>Lihat Foto</a>";
}
</script>

</body>
</html>
